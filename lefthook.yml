# EXAMPLE USAGE:
#
#   Refer for explanation to following link:
#   https://github.com/evilmartians/lefthook/blob/master/docs/configuration.md
#

pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,css}"
      run: "bunx oxfmt --no-error-on-unmatched-pattern {staged_files} && git add {staged_files}"
    lint:
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx}"
      run: "bunx oxlint --fix {staged_files} && git add {staged_files}"
  scripts:
    "commitlint.sh":
      runner: "bash"
